name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  CACHE_VERSION: v1

jobs:
  # Quality Gates - Fast feedback for developers
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Type checking
      run: npm run typecheck
      
    - name: Code linting
      run: npm run lint:check
      
    - name: Code formatting check
      run: npm run format:check
      
    - name: Dependency audit
      run: npm audit --audit-level moderate
      continue-on-error: true

  # Unit Tests with Coverage
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: quality-gates
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Run unit tests with coverage
      run: npm run test:coverage
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: ./coverage/
        flags: unittests
        name: unit-tests-coverage
        fail_ci_if_error: false
        
    - name: Archive coverage artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

  # Build and Package Verification
  build-verification:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [quality-gates, unit-tests]
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Build extension
      run: npm run build:prod
      
    - name: Package VSIX
      run: npm run vsce-package
      
    - name: Verify package (Unix)
      if: runner.os != 'Windows'
      run: |
        ls -la *.vsix
        test -f ai-product-owner-agent-*.vsix
        
    - name: Verify package (Windows)
      if: runner.os == 'Windows'
      run: |
        dir *.vsix
        if (!(Test-Path "ai-product-owner-agent-*.vsix")) { exit 1 }
      shell: powershell
      
    - name: Check bundle size (Unix)
      if: runner.os != 'Windows'
      run: |
        npm run build:prod
        ls -lh out/
        # Fail if bundle is too large (1MB limit)
        test $(stat -c%s out/extension.js) -lt 1048576
        
    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v3
      if: matrix.os == 'ubuntu-latest'
      with:
        name: vsix-package-${{ github.sha }}
        path: '*.vsix'
        retention-days: 30

  # Integration Tests (VS Code Extension Host)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Compile extension
      run: npm run compile
      
    - name: Run integration tests
      run: npm run test:integration
      
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: test-results/
        retention-days: 7

  # Security and Vulnerability Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality-gates
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Run security audit
      run: npm audit --audit-level high
      continue-on-error: true
      
    - name: Run validation checks
      run: npm run validate

  # Final Status Check
  pr-status-check:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: [quality-gates, unit-tests, build-verification, integration-tests, security-scan]
    if: always()
    
    steps:
    - name: Check all jobs status
      run: |
        echo "Quality Gates: ${{ needs.quality-gates.result }}"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Build Verification: ${{ needs.build-verification.result }}"
        echo "Integration Tests: ${{ needs.integration-tests.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        
        if [[ "${{ needs.quality-gates.result }}" != "success" || 
              "${{ needs.unit-tests.result }}" != "success" || 
              "${{ needs.build-verification.result }}" != "success" || 
              "${{ needs.integration-tests.result }}" != "success" ]]; then
          echo "❌ One or more required checks failed"
          exit 1
        else
          echo "✅ All required checks passed"
        fi
        
    - name: Post PR comment on failure
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ **CI Pipeline Failed**\n\nOne or more required checks failed. Please review the failed jobs and fix the issues before merging.\n\n[View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          })
          
    - name: Post PR comment on success
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ **CI Pipeline Passed**\n\nAll required checks have passed successfully. This PR is ready for review and merge.\n\n[View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          })
